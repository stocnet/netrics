articles:
  - title: Tutorials
    desc: |
      Static, read-only versions of the interactive `learnr` tutorials
      bundled with the package. Install the package and run `run_tute()`
      for the full interactive experience.
    contents:
      - "`articles/centrality`"
      - "`articles/community`"
      - "`articles/position`"
      - "`articles/topology`"
reference:
  - title: "Marks"
    desc: |
      Functions for identifying properties of nodes or ties,
      all returning logical scalars or vectors.
  - subtitle: "Nodal marks"
    desc: |
      `node_is_*()` functions return a vector of logical values the length
      of the nodes in the network.
    contents:
      - starts_with("node_is_")
  - subtitle: "Tie marks"
    desc: |
      `tie_is_*()` functions return a vector of logical values the length
      of the ties in the network.
    contents:
      - starts_with("tie_is_")
    
  - title: "Measures"
    desc: |
      Functions for measuring networks and returning a numeric vector or value.
      `net_` measures return one or, in some cases of two-mode measures,
      two values.
      All `node_` and `tie_` measures return a single vector,
      the length of the nodes or ties in the network, respectively.
  - subtitle: "Centrality"
    contents:
      - starts_with("measure_central")
  - subtitle: "Brokerage"
    contents:
      - starts_with("measure_broker")
  - subtitle: "Hierarchy"
    contents:
      - measure_hierarchy
  - subtitle: "Cohesion"
    contents:
      - measure_breadth
      - measure_cohesion
      - starts_with("measure_closure")
  - subtitle: "Topology"
    contents:
      - measure_features
      - measure_fragmentation
      - measure_core
      - measure_fit
  - subtitle: "Heterogeneity"
    contents:
      - starts_with("measure_assort")
      - starts_with("measure_diverse")
  - subtitle: "Dynamics"
    contents:
      - measure_periods
      - starts_with("measure_diffusion")
    
  - title: "Memberships"
    desc: |
      Functions for identifying nodes' community, cluster, or class membership,
      recognisable by the `_in_` in the function name.
      They return a character vector the length of the nodes in the network.
    contents:
      - contains("_in_")

  - title: "Motifs"
    desc: |
      Functions for tabulating the subgraphs that nodes or networks participate in,
      recognisable by the `_x_` in the function name.
      They return a matrix or table, with the motif or other property as columns.
    contents:
      - contains("_x_")
      
  - title: "Methods"
    desc: "Methods used in other functions but documented here:"
    contents:
      - starts_with("method_")

